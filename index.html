<body>

  <!--
    Back button returns to the main Games page using a relative path.
  -->
  <a class="back-link" href="../../games.html" aria-label="Back to games">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 5 8 12 15 19"></polyline>
    </svg>
    <span>Back</span>
  </a>

  <main class="game">
    <h1 class="title">Simon</h1>

    <!--
      Highest level reached on this device in the current mode (normal or strict).
      simon.js fills in the label and number and remembers them between visits.
    -->
    <p id="best" class="best"><span id="best-label">Best level</span>: <span id="best-level">–</span></p>

    <!--
      The game board: four colored pads in a 2x2 grid, shaped into one circle by CSS.
      - data-color is read by simon.js to know which pad was clicked.
      - aria-label gives screen readers a name, since the pads contain no text.
      - Pads start disabled; simon.js enables them only during the player's turn.
    -->
    <div id="board" class="board">
      <button type="button" class="pad pad-green"  data-color="green"  aria-label="Green"  disabled></button>
      <button type="button" class="pad pad-red"    data-color="red"    aria-label="Red"    disabled></button>
      <button type="button" class="pad pad-yellow" data-color="yellow" aria-label="Yellow" disabled></button>
      <button type="button" class="pad pad-blue"   data-color="blue"   aria-label="Blue"   disabled></button>

      <!-- Center hub: shows the current level and holds the Start / Restart button -->
      <div class="hub">
        <span class="hub-label">Level</span>
        <span id="current-level" class="hub-level">–</span>
        <button type="button" id="start-button" class="start-button idle">Start</button>
      </div>
    </div>

    <!--
      Status message: replaces the old alert() popups.
      role="status" makes screen readers announce changes automatically.
      The data-state attribute ("info", "good" or "bad") controls its color in CSS.
    -->
    <p id="status" class="status" data-state="info" role="status">Press Start to play.</p>

    <!-- Switches under the board. role="switch" + aria-checked tell screen readers these are on/off toggles. -->
    <div class="controls">
      <!-- Sound switch: turns the tones on or off (remembered between visits) -->
      <button type="button" id="sound-button" class="toggle-button" role="switch" aria-checked="true">
        Sound: On
      </button>
      <!-- Strict mode switch: when on, one wrong pad ends the game -->
      <button type="button" id="strict-button" class="toggle-button" role="switch" aria-checked="false">
        Strict mode: Off
      </button>
    </div>
  </main>

  <!-- Game logic (loaded last so the elements above already exist) -->
  <script src="simon.js"></script>
</body>
